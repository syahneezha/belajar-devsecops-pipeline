name: DevSecOps CI/CD Pipeline

on:
    push:
        branches: ["main", "master", "tahap-*"]
    pull_request:
        branches: ["main", "master"]
    workflow_dispatch: {}

jobs:
    # ==========================================
    # CI JOB 1: SAST Scan (Semgrep)
    # ==========================================
    sast-scan:
        name: Semgrep SAST Scan
        runs-on: ubuntu-latest
        container:
            image: semgrep/semgrep
        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4

            - name: Run Semgrep SAST
              run: semgrep scan --config auto --error --verbose --exclude=".github"

    # ==========================================
    # CI JOB 2: Code Quality (Pylint)
    # ==========================================
    pylint-check:
        name: Pylint Code Quality Gate
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.10"

            - name: Install Dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install pylint
                  pip install -r requirements.txt

            - name: Run Pylint Check
              run: pylint --fail-under=9.0 app.py

    # ==========================================
    # CI JOB 3: Secret Scanning (Gitleaks)
    # ==========================================
    gitleaks-scan:
        name: Gitleaks Secret Scan
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: read
        steps:
            - name: Checkout code (full history)
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Run Gitleaks
              uses: gitleaks/gitleaks-action@v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GITLEAKS_ENABLE_COMMENTS: "false"

    # ==========================================
    # CI JOB 4: Dependency Audit (pip-audit)
    # ==========================================
    pip-audit-scan:
        name: pip-audit Dependency Scan
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python 3.10
              uses: actions/setup-python@v5
              with:
                  python-version: "3.10"

            - name: Install pip-audit
              run: |
                  python -m pip install --upgrade pip
                  pip install pip-audit

            - name: Audit dependencies
              run: pip-audit -r requirements.txt --strict --desc

    # ==========================================
    # CI JOB 5: Unit Test + Coverage (pytest)
    # ==========================================
    pytest-coverage:
        name: Pytest Coverage
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4

            - name: Setup Python 3.10
              uses: actions/setup-python@v5
              with:
                  python-version: "3.10"
                  cache: pip
                  cache-dependency-path: |
                      requirements.txt
                      requirements-dev.txt

            - name: Install Dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements-dev.txt

            - name: Run Pytest with Coverage Gate
              run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80

    # ==========================================
    # CI JOB 6: Dockerfile Lint (Hadolint)
    # ==========================================
    hadolint-lint:
        name: Hadolint Dockerfile Lint
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4

            - name: Run Hadolint
              run: |
                  docker run --rm -i hadolint/hadolint:v2.12.0 \
                      hadolint --failure-threshold warning - < Dockerfile

    # ==========================================
    # CI JOB 7: Docker Misconfiguration (Trivy Config)
    # ==========================================
    trivy-config-scan:
        name: Trivy Config Scan
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4

            - name: Run Trivy Config Scan
              run: |
                  docker run --rm -v "$PWD:/work:ro" -w /work \
                      aquasec/trivy:0.69.3 config \
                      --severity HIGH,CRITICAL --exit-code 1 .

    # ==========================================
    # CI JOB 8: Build & Image Security (Tahap 3)
    # ==========================================
    build-image-security:
        name: Build and Image Security
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        outputs:
            image: ${{ steps.prep.outputs.image }}
            digest: ${{ steps.build.outputs.digest }}
        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Prepare Image Name (Lowercase)
              id: prep
              run: |
                  REPO_LC=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
                  echo "image=$REPO_LC" >> $GITHUB_OUTPUT

            - name: Build and Push Docker Image
              id: build
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
                  load: ${{ github.ref != 'refs/heads/main' || github.event_name != 'push' }}
                  tags: ${{ steps.prep.outputs.image }}:sha-${{ github.sha }}
                  provenance: ${{ (github.ref == 'refs/heads/main' && github.event_name == 'push') && 'mode=max' || 'false' }}                  
                  sbom: false

            - name: Run Trivy Image Scan (Pinned Version)
              env:
                  TRIVY_USERNAME: ${{ github.actor }}
                  TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  TARGET="${{ steps.prep.outputs.image }}:sha-${{ github.sha }}"
                  
                  if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event_name }}" = "push" ]; then
                      TARGET="${{ steps.prep.outputs.image }}@${{ steps.build.outputs.digest }}"
                  fi
                  
                  docker run --rm \
                      -e TRIVY_USERNAME \
                      -e TRIVY_PASSWORD \
                      -v /var/run/docker.sock:/var/run/docker.sock \
                      -v "$PWD:/workspace" -w /workspace \
                      aquasec/trivy:0.69.3 image \
                      --severity HIGH,CRITICAL \
                      --exit-code 1 \
                      --ignore-unfixed \
                      --scanners vuln \
                      $TARGET

            - name: Generate SBOM (CycloneDX)
              if: github.ref == 'refs/heads/main' && github.event_name == 'push'
              env:
                  TRIVY_USERNAME: ${{ github.actor }}
                  TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  docker run --rm \
                      -e TRIVY_USERNAME \
                      -e TRIVY_PASSWORD \
                      -v ${{ github.workspace }}:/workspace \
                      aquasec/trivy:0.69.3 image \
                      --format cyclonedx \
                      --output /workspace/sbom.cdx.json \
                      ${{ steps.prep.outputs.image }}@${{ steps.build.outputs.digest }}

            - name: Upload SBOM Artifact
              if: github.ref == 'refs/heads/main' && github.event_name == 'push'
              uses: actions/upload-artifact@v4
              with:
                  name: sbom-cyclonedx
                  path: sbom.cdx.json

    # ==========================================
    # CI JOB 9: DAST Scan (OWASP ZAP Baseline)
    # ==========================================
    zap-baseline-scan:
        name: OWASP ZAP Baseline Scan
        needs: [build-image-security]
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: read
        env:
            APP_IMAGE: ${{ needs.build-image-security.outputs.image }}@${{ needs.build-image-security.outputs.digest }}
            ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:2.17.0
        steps:
            - name: Log in to GHCR
              uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Create Docker Network
              run: docker network create zapnet

            - name: Run App Container from GHCR Image
              run: |
                  docker pull "$APP_IMAGE"
                  docker run -d --name web-flask --network zapnet "$APP_IMAGE"

            - name: Wait Until App Is Healthy
              run: |
                  for i in $(seq 1 15); do
                      if docker exec web-flask python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"; then
                          echo "Aplikasi sehat"
                          exit 0
                      fi
                      echo "Menunggu aplikasi ($i/15)..."
                      sleep 2
                  done
                  docker logs web-flask
                  exit 1

            - name: Run ZAP Baseline Scan
              run: |
                  mkdir -p zap-out
                  chmod 777 zap-out
                  docker run --rm --network zapnet \
                      -v "$PWD/zap-out:/zap/wrk:rw" \
                      "$ZAP_IMAGE" \
                      zap-baseline.py -t http://web-flask:5000 -r zap-report.html -I

            - name: Upload ZAP Report
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: zap-report
                  path: zap-out/zap-report.html
                  if-no-files-found: warn

            - name: Show App Logs on Failure
              if: failure()
              run: docker logs web-flask || true

            - name: Cleanup
              if: always()
              run: |
                  docker rm -f web-flask || true
                  docker network rm zapnet || true

    # ==========================================
    # CI JOB 10: Sign & Attest Image & SBOM (Cosign)
    # ==========================================
    sign-and-attest:
        name: Cosign Sign & Attest SBOM
        runs-on: ubuntu-latest
        needs: 
            - gitleaks-scan
            - sast-scan
            - pylint-check
            - pip-audit-scan
            - pytest-coverage
            - hadolint-lint
            - trivy-config-scan
            - build-image-security
            - zap-baseline-scan
        if: github.ref == 'refs/heads/main'
        permissions:
            contents: read
            packages: write
            id-token: write
        steps:
            - name: Install Cosign
              uses: sigstore/cosign-installer@v3.5.0
            
            - name: Login to GitHub Container Registry
              uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
                
            - name: Download SBOM Artifact
              uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
              with:
                  name: sbom-cyclonedx
                
            - name: Sign Image
              env:
                  IMAGE_DIGEST: ${{ needs.build-image-security.outputs.digest }}
              run: |
                  cosign sign --yes ghcr.io/${{ github.repository_owner }}/belajar-devsecops-pipeline@${IMAGE_DIGEST}
                
            - name: Attest SBOM
              env:
                  IMAGE_DIGEST: ${{ needs.build-image-security.outputs.digest }}
              run: |
                  cosign attest --yes --predicate sbom.cdx.json --type cyclonedx ghcr.io/${{ github.repository_owner }}/belajar-devsecops-pipeline@${IMAGE_DIGEST}                  

    # ==========================================
    # CD STAGE: Deploy ke VM (Tahap 6)
    # ==========================================
    deploy-to-vm:
        name: Deploy to Production VM
        needs: sign-and-attest
        runs-on: [self-hosted, linux]
        environment: production-vm
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Verify Image Signature with Cosign
              run: |
                DIGEST="${{ needs.build-image-security.outputs.digest }}"
                
                if [ -n "$DIGEST" ] && [ "$DIGEST" != "null" ]; then
                  IMAGE_REF="ghcr.io/${{ github.repository_owner }}/belajar-devsecops-pipeline@${DIGEST}"
                else
                  IMAGE_REF="ghcr.io/${{ github.repository_owner }}/belajar-devsecops-pipeline:sha-${{ github.sha }}"
                fi
                
                echo "APP_IMAGE=$IMAGE_REF" >> $GITHUB_ENV

                echo "Verifikasi tanda tangan Cosign via OIDC..."
                cosign verify \
                  --certificate-identity-regexp "https://github.com/${{ github.repository_owner }}/.*" \
                  --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
                  "$IMAGE_REF"

            - name: Pull Image from GHCR (Public)
              run: |
                docker pull "${{ env.APP_IMAGE }}"

            - name: Backup Current Image ID (For Rollback)
              id: backup
              run: |
                cd deploy
                PREV_IMG=$(docker compose images -q web-flask 2>/dev/null || echo "")
                echo "PREVIOUS_IMAGE=$PREV_IMG" >> $GITHUB_ENV

            - name: Deploy and Run Health Check / Smoke Test
              id: deploy
              run: |
                cd deploy
                export APP_IMAGE="${{ env.APP_IMAGE }}"
                
                docker compose down 
                docker compose up -d

                echo "Menunggu container stabil & verifikasi health check ke port 5000..."
                HEALTH_PASSED=false
                for i in {1..12}; do
                  if curl -sSf http://localhost:5000/health > /dev/null 2>&1; then
                    HEALTH_PASSED=true
                    break
                  fi
                  sleep 3
                done

                if [ "$HEALTH_PASSED" = "false" ]; then
                  echo "Health check gagal!"
                  exit 1
                fi

                echo "Menjalankan Smoke Test..."
                curl -sSf http://localhost:5000/ > /dev/null 2>&1

            - name: Automatic Rollback on Failure
              if: failure() && steps.deploy.conclusion == 'failure'
              run: |
                echo "Deployment/Health check gagal. Melakukan rollback otomatis..."
                cd deploy
                if [ -n "${{ env.PREVIOUS_IMAGE }}" ]; then
                  export APP_IMAGE="${{ env.PREVIOUS_IMAGE }}"
                  docker-compose down
                  docker-compose up -d
                  echo "Rollback ke versi image sebelumnya selesai."
                else
                  echo "Tidak ada image lama untuk dikembalikan."
                fi