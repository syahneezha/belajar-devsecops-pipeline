name: DevSecOps CI/CD Pipeline

on:
    push:
        branches: ["main", "master"]
    pull_request:
        branches: ["main", "master"]
    workflow_dispatch: {}

jobs:
    # ==========================================
    # CI JOB 1: SAST Scan (Semgrep)
    # ==========================================
    sast-scan:
        name: Semgrep SAST Scan
        runs-on: ubuntu-latest
        container:
            image: semgrep/semgrep
        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4

            - name: Run Semgrep SAST
              # --exclude=".github" mencegah Semgrep memeriksa file workflow YAML
              run: semgrep scan --config auto --error --verbose --exclude=".github"

    # ==========================================
    # CI JOB 2: Code Quality (Pylint)
    # ==========================================
    pylint-check:
        name: Pylint Code Quality Gate
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.10"

            - name: Install Dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install pylint
                  pip install -r requirements.txt

            - name: Run Pylint Check
              run: pylint --fail-under=9.0 app.py

    # ==========================================
    # CI JOB 3: Secret Scanning (Gitleaks)
    # ==========================================
    gitleaks-scan:
        name: Gitleaks Secret Scan
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: read
        steps:
            - name: Checkout code (full history)
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Run Gitleaks
              uses: gitleaks/gitleaks-action@v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GITLEAKS_ENABLE_COMMENTS: "false"

    # ==========================================
    # CI JOB 4: Dependency Audit (pip-audit)
    # ==========================================
    pip-audit-scan:
        name: pip-audit Dependency Scan
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python 3.10
              uses: actions/setup-python@v5
              with:
                  python-version: "3.10"

            - name: Install pip-audit
              run: |
                  python -m pip install --upgrade pip
                  pip install pip-audit

            - name: Audit dependencies
              run: pip-audit -r requirements.txt --strict --desc

    # ==========================================
    # CI JOB 5: Unit Test + Coverage (pytest)
    # ==========================================
    pytest-coverage:
        name: Pytest Coverage
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4

            - name: Setup Python 3.10
              uses: actions/setup-python@v5
              with:
                  python-version: "3.10"
                  cache: pip
                  cache-dependency-path: |
                      requirements.txt
                      requirements-dev.txt

            - name: Install Dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements-dev.txt

            - name: Run Pytest with Coverage Gate
              run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80

    # ==========================================
    # CI JOB 6: Dockerfile Lint (Hadolint)
    # ==========================================
    hadolint-lint:
        name: Hadolint Dockerfile Lint
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4

            - name: Run Hadolint
              run: |
                  docker run --rm -i hadolint/hadolint:v2.12.0 \
                      hadolint --failure-threshold warning - < Dockerfile

    # ==========================================
    # CI JOB 7: Docker Misconfiguration (Trivy Config)
    # ==========================================
    trivy-config-scan:
        name: Trivy Config Scan
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4

            - name: Run Trivy Config Scan
              run: |
                  docker run --rm -v "$PWD:/work:ro" -w /work \
                      aquasec/trivy:0.69.3 config \
                      --severity HIGH,CRITICAL --exit-code 1 .

    # ==========================================
    # CI JOB 8: Build & Image Security (Tahap 3)
    # ==========================================
    build-image-security:
        name: Build and Image Security
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        outputs:
            image: ${{ steps.prep.outputs.image }}
            digest: ${{ steps.build.outputs.digest }}
        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Prepare Image Name (Lowercase)
              id: prep
              run: |
                  REPO_LC=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
                  echo "image=$REPO_LC" >> $GITHUB_OUTPUT

            - name: Build and Push Docker Image
              id: build
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
                  load: ${{ github.ref != 'refs/heads/main' || github.event_name != 'push' }}
                  tags: ${{ steps.prep.outputs.image }}:sha-${{ github.sha }}
                  provenance: ${{ github.event_name == 'push' && 'mode=max' || false }}
                  sbom: false

            - - name: Run Trivy Image Scan (Pinned Version)
              env:
                  TRIVY_USERNAME: ${{ github.actor }}
                  TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  TARGET="${{ steps.prep.outputs.image }}:sha-${{ github.sha }}"
                  
                  if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event_name }}" = "push" ]; then
                      TARGET="${{ steps.prep.outputs.image }}@${{ steps.build.outputs.digest }}"
                  fi
                  
                  docker run --rm \
                      -e TRIVY_USERNAME \
                      -e TRIVY_PASSWORD \
                      -v /var/run/docker.sock:/var/run/docker.sock \
                      -v "$PWD:/workspace" -w /workspace \
                      aquasec/trivy:0.69.3 image \
                      --severity HIGH,CRITICAL \
                      --exit-code 1 \
                      --ignore-unfixed \
                      --scanners vuln \
                      $TARGET

            - name: Generate SBOM (CycloneDX)
              if: github.ref == 'refs/heads/main' && github.event_name == 'push'
              env:
                  TRIVY_USERNAME: ${{ github.actor }}
                  TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  docker run --rm \
                      -e TRIVY_USERNAME \
                      -e TRIVY_PASSWORD \
                      -v ${{ github.workspace }}:/workspace \
                      aquasec/trivy:0.69.3 image \
                      --format cyclonedx \
                      --output /workspace/sbom.cdx.json \
                      ${{ steps.prep.outputs.image }}@${{ steps.build.outputs.digest }}

            - name: Upload SBOM Artifact
              if: github.ref == 'refs/heads/main' && github.event_name == 'push'
              uses: actions/upload-artifact@v4
              with:
                  name: sbom-cyclonedx
                  path: sbom.cdx.json

    # ==========================================
    # CD STAGE: Deploy ke VM
    # ==========================================
    deploy-to-vm:
        name: Build & Deploy to VirtualBox VM
        needs: [sast-scan, pylint-check, build-image-security]
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        runs-on: self-hosted
        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4

            - name: Build and Run Container
              run: |
                  docker build -t secure-flask-app:latest .
                  docker stop web-flask || true
                  docker rm web-flask || true
                  docker run -d -p 5000:5000 --name web-flask secure-flask-app:latest
                  docker ps | grep web-flask